name: iOS Xcode project and simulator build
on:
  workflow_dispatch:
  push:
    paths:
      - 'dist/**'
      - 'ios/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-project.yml'
  pull_request:
    paths:
      - 'dist/**'
      - 'ios/**'
      - 'tests/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-project.yml'
jobs:
  ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test web features
        run: npm test
      - name: Sync web assets into native project
        run: npm run ios:sync
      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          npm run ios:build:simulator
      - name: Package Xcode project
        run: zip -qry truckload-ios-xcode-project.zip ios
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: truckload-ios-xcode-project
          path: truckload-ios-xcode-project.zip
          retention-days: 14
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: truckload-ios-simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
